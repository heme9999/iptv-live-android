name: Build release APKs
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        default: v6.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/iptv-release.jks"
      - run: ./gradlew assembleRelease
        env:
          IPTV_KEYSTORE_PATH: ${{ runner.temp }}/iptv-release.jks
          IPTV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IPTV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          IPTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: |
          cp app/build/outputs/apk/tcl/release/app-tcl-release.apk IPTV-Live-TCL.apk
          cp app/build/outputs/apk/sony/release/app-sony-release.apk IPTV-Live-Sony.apk
          cp app/build/outputs/apk/pixel/release/app-pixel-release.apk IPTV-Live-Pixel.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            IPTV-Live-TCL.apk
            IPTV-Live-Sony.apk
            IPTV-Live-Pixel.apk
